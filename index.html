<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>خارج الخدمة للصيانة</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{min-height:100vh;min-height:100svh;background:#fff;display:grid;place-items:center;overflow:hidden;font-family:Tahoma,Arial,sans-serif}
    main{width:min(94vw,720px);display:grid;place-items:center}
    svg{display:block;width:100%;height:auto;max-height:88svh}
    text{font-family:Tahoma,Arial,sans-serif}
  </style>
</head>
<body>
  <main aria-label="خارج الخدمة للصيانة">
    <svg viewBox="0 0 720 430" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
      <title id="title">خارج الخدمة للصيانة</title>
      <desc id="desc">رجل آلي صغير يحمل علمًا مكتوبًا عليه خارج الخدمة للصيانة</desc>
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4f6f8"/>
          <stop offset="1" stop-color="#aeb7c2"/>
        </linearGradient>
        <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f32635"/>
          <stop offset="1" stop-color="#c90019"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#172033" flood-opacity=".13"/>
        </filter>
      </defs>

      <!-- علم الصيانة -->
      <g filter="url(#shadow)">
        <path d="M514 77 Q514 68 523 68 H682 Q691 68 691 77 V190 Q691 199 682 199 H523 Q514 199 514 190 Z" fill="url(#flag)"/>
        <path d="M514 77 Q553 89 591 77 T691 77" fill="none" stroke="#ff7b84" stroke-width="3" opacity=".55"/>
        <text x="602" y="124" fill="#fff" font-size="25" font-weight="700" text-anchor="middle" direction="rtl">خارج الخدمة</text>
        <text x="602" y="160" fill="#fff" font-size="27" font-weight="700" text-anchor="middle" direction="rtl">للصيانة</text>
      </g>
      <path d="M505 58 V340" stroke="#687382" stroke-width="8" stroke-linecap="round"/>
      <circle cx="505" cy="55" r="8" fill="#aeb7c2" stroke="#687382" stroke-width="3"/>

      <!-- الروبوت -->
      <g filter="url(#shadow)" stroke="#596574" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <!-- antenna -->
        <path d="M340 91 V65" fill="none"/>
        <circle cx="340" cy="54" r="12" fill="#e50914" stroke="#596574"/>
        <!-- head -->
        <rect x="267" y="91" width="146" height="112" rx="34" fill="url(#metal)"/>
        <rect x="284" y="119" width="112" height="55" rx="19" fill="#263344" stroke="#596574" stroke-width="5"/>
        <circle cx="316" cy="146" r="8" fill="#8ee7ff" stroke="none"/>
        <circle cx="364" cy="146" r="8" fill="#8ee7ff" stroke="none"/>
        <path d="M328 164 Q340 172 352 164" fill="none" stroke="#8ee7ff" stroke-width="4"/>
        <!-- body -->
        <rect x="284" y="213" width="112" height="91" rx="25" fill="url(#metal)"/>
        <rect x="311" y="234" width="58" height="37" rx="10" fill="#263344" stroke="#596574" stroke-width="4"/>
        <circle cx="340" cy="252" r="8" fill="#e50914" stroke="none"/>
        <!-- left arm holding pole -->
        <path d="M288 232 L246 252 L228 219" fill="none" stroke-width="22"/>
        <path d="M228 219 L228 207" fill="none" stroke-width="18"/>
        <circle cx="228" cy="204" r="13" fill="#dce2e8"/>
        <!-- right arm -->
        <path d="M392 233 L429 254 L445 236" fill="none" stroke-width="22"/>
        <circle cx="447" cy="233" r="13" fill="#dce2e8"/>
        <!-- legs -->
        <path d="M310 302 L302 344" fill="none" stroke-width="23"/>
        <path d="M370 302 L378 344" fill="none" stroke-width="23"/>
        <path d="M283 350 H315" fill="none" stroke-width="15"/>
        <path d="M365 350 H397" fill="none" stroke-width="15"/>
      </g>
      <!-- small hand wrap around flag pole -->
      <path d="M219 197 Q228 188 238 197 L241 211 Q232 221 221 213 Z" fill="#e2e7ec" stroke="#596574" stroke-width="5"/>
      <!-- subtle ground shadow -->
      <ellipse cx="340" cy="382" rx="128" ry="13" fill="#e9edf1"/>
    </svg>
  </main>
</body>
</html>
