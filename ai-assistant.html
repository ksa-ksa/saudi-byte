</style><script defer src="/assets/sb-ai-beta.js?v=2.3"></script></head><body><main><header><a href="/" id="back" target="_blank" rel="noopener noreferrer">← SAUDI BYTE</a><span class="badge">BETA 2.3</span><select id="language" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option></select></header><h1>SAUDI BYTE <span style="color:#ff3948">AI ASSISTANT</span></h1><p id="intro">مساعدك للألعاب والبرامج والكمبيوتر، مباشرة من المتصفح.</p><section class="panel"><div class="controls"><label><input id="cloud" type="checkbox"><span id="cloud-label">أوافق على إرسال سؤالي لخدمة الذكاء الاصطناعي</span></label><label><input id="web" type="checkbox" disabled><span id="web-label">البحث بالإنترنت</span></label><label><input id="voice" type="checkbox"><span id="voice-label">قراءة الرد صوتيًا</span></label></div><p id="privacy">لا تسجل دخولك ولا تدخل بيانات حساسة. قد يعالج المتصفح الصوت عبر خدمته. المحادثة في ذاكرة الصفحة فقط.</p><details class="voice-settings" open><summary id="voice-settings-title">إعدادات الصوت</summary><div class="voice-grid"><label><span id="dialect-label">اللهجة</span><select id="dialect"><option value="ar-SA">السعودية</option><option value="ar">العربية الفصحى</option></select></label><label><span id="gender-label">تفضيل الصوت</span><select id="gender"><option value="auto">تلقائي</option><option value="male">رجالي</option><option value="female">نسائي</option></select></label><label><span id="voice-choice-label">الصوت المتاح</span><select id="voice-choice"></select></label><label><span id="rate-label">السرعة</span><div class="rate-control"><input id="rate" type="range" min="0.7" max="1.3" step="0.05" value="0.9"><output id="rate-value" for="rate">0.90×</output></div></label></div><label style="margin-top:10px"><input id="background-voice" type="checkbox" checked><span id="background-voice-label">استمرار الصوت في الخلفية (والميكروفون عند تفعيل المحادثة المستمرة)</span></label><p id="background-voice-note" class="voice-note">يمكن إيقاف الصوت والميكروفون في أي وقت من صفحة المساعد.</p><p id="voice-note" class="voice-note" role="status"></p><button type="button" id="sample">استمع للتجربة</button></details><div class="suggestions" id="suggestions"></div><div class="chat" id="chat" role="log" aria-live="polite"></div><form id="form"><textarea id="question" maxlength="1500" required placeholder="اسألني عن الألعاب أو البرامج..." aria-label="Question"></textarea><div class="actions"><button class="primary" id="send">إرسال</button><button type="button" id="mic">🎙️ تحدث</button><button type="button" id="continuous" aria-pressed="false">🎧 محادثة صوتية مستمرة</button><button type="button" id="stop">إيقاف</button><button type="button" id="clear">محادثة جديدة</button></div></form><p id="status" role="status"></p></section><section class="panel"><strong id="nav-title">أقسام الموقع</strong><div class="suggestions" id="sections" style="margin-top:12px"></div></section></main></body></html>
